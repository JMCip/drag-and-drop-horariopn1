<section class="seccion-panel">
  <div class="fila-metricas">
    <div class="tarjeta-resumen">
      <span class="valor-resumen tabular-nums">{{ totalUsuarios }}</span>
      <span class="etiqueta-resumen">Total Usuarios</span>
    </div>
    <div class="tarjeta-resumen">
      <span class="valor-resumen tabular-nums">{{ estudiantes.length }}</span>
      <span class="etiqueta-resumen">Estudiantes</span>
    </div>
    <div class="tarjeta-resumen">
      <span class="valor-resumen tabular-nums">{{ profesores.length }}</span>
      <span class="etiqueta-resumen">Profesores</span>
    </div>
    <div class="tarjeta-resumen">
      <span class="valor-resumen tabular-nums">{{ totalAdmins }}</span>
      <span class="etiqueta-resumen">Admins</span>
    </div>
  </div>

  <div class="tarjeta-listados">
    <div class="sub-pestanas">
      <button type="button" [class.activa]="subPestanaListado === 'estudiantes'" (click)="subPestanaListado = 'estudiantes'">Estudiantes</button>
      <button type="button" [class.activa]="subPestanaListado === 'profesores'" (click)="subPestanaListado = 'profesores'">Profesores</button>
      <button type="button" [class.activa]="subPestanaListado === 'materias'" (click)="subPestanaListado = 'materias'">Materias</button>
    </div>

    <table class="tabla-admin">
      <thead>
      <tr>
        <th>Nombre</th>
        <th>{{ subPestanaListado === 'materias' ? 'Docente' : 'Correo' }}</th>
        <th>Detalle / Carrera</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let fila of filas">
        <td>{{ fila.nombre }}</td>
        <td>{{ fila.segunda }}</td>
        <td>{{ fila.detalle }}</td>
      </tr>
      <tr *ngIf="filas.length === 0">
        <td colspan="3">No hay registros.</td>
      </tr>
      </tbody>
    </table>
  </div>
</section>
